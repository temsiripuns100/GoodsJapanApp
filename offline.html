<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ออฟไลน์ | Goods Japan</title>
    <meta name="theme-color" content="#C41E3A">
    <link rel="icon" href="assets/images/logo.png">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        :root { --red:#C41E3A; --red-hover:#A3182E; --navy:#1B2A4A; --cream:#FDFBF7; --gray:#555E68; --border:#E5E8EC; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            padding: 32px max(20px, env(safe-area-inset-left, 0px)) 32px max(20px, env(safe-area-inset-right, 0px));
            background: var(--cream); color: var(--navy);
            font-family: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        main { max-width: 380px; width: 100%; text-align: center; display: grid; gap: 14px; justify-items: center; }
        img { width: 96px; height: 96px; }
        h1 { margin: 6px 0 0; font-size: 1.4rem; text-wrap: balance; }
        p { margin: 0; color: var(--gray); line-height: 1.6; }
        .card {
            width: 100%; margin-top: 8px; padding: 16px; text-align: left;
            background: #fff; border: 1px solid var(--border); border-radius: 14px;
            display: grid; gap: 6px; font-size: .95rem;
        }
        .card b { color: var(--navy); }
        button {
            margin-top: 6px; border: 0; border-radius: 999px; padding: 12px 28px;
            background: var(--red); color: #fff; font: inherit; font-weight: 700; cursor: pointer;
        }
        button:hover { background: var(--red-hover); }
        button:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="assets/icons/icon-192.png" alt="Goods Japan">
        <h1>ตอนนี้ไม่มีอินเทอร์เน็ต</h1>
        <p>ต่อเน็ตแล้วกดลองใหม่ได้เลย หน้าที่เคยเปิดไว้แล้วยังดูได้ตามปกติ</p>
        <div class="card">
            <div><b>Goods Japan กูดส์ เจแปน</b></div>
            <div>ปั๊ม ปตท. คลอง 4 ข้าง Café Amazon ปทุมธานี</div>
            <div>ร้านเปิด 9:00 น. เป็นต้นไป</div>
        </div>
        <button type="button" onclick="location.reload()">ลองใหม่</button>
    </main>
</body>
</html>
